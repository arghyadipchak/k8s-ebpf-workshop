apiVersion: v1
kind: Pod
metadata:
  name: nginx-sidecar
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
    - name: sidecar
      image: alpine/curl:latest
      # Keep the container running so we can exec into it
      command: ['/bin/sh', '-c', 'sleep infinity']
